name: 1Password Connection Metadata Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onepassword-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test diagnostic privacy boundary without credentials or network
        run: node --test tests/ci/test-onepassword-connection-status.cjs

      - name: Check configured connection metadata without accessing vault items
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
        run: node scripts/check-onepassword-connection-status.cjs

      - name: Comment summary
        run: |
          echo "Composio reports the configured 1Password connection as ACTIVE. This checks stored connection metadata, not live vault health. No vault items or credentials were synchronized." >> "$GITHUB_STEP_SUMMARY"
