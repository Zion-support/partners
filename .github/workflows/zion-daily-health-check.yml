name: zion-daily-health-check

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check money-page uptime
        run: |
          set -euo pipefail
          fail=0
          for url in \
            https://ziontechgroup.com/ \
            https://ziontechgroup.com/book/ \
            https://ziontechgroup.com/plans/ \
            https://ziontechgroup.com/discovery/ \
            https://ziontechgroup.com/contact/; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 "$url" || echo 000)
            echo "$url: $code"
            echo "- $url — $code" >> "$GITHUB_STEP_SUMMARY"
            case "$code" in
              200|301|302) ;;
              *)
                echo "::error::Site down: $url returned $code"
                fail=1
                ;;
            esac
          done
          echo "## Zion money-page health" >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

      - name: Setup Node
        if: env.HAS_COMPOSIO_KEY == 'true'
        uses: actions/setup-node@v4
        env:
          HAS_COMPOSIO_KEY: ${{ secrets.COMPOSIO_API_KEY != '' }}
        with:
          node-version: 20

      - name: Install Composio SDK
        if: env.HAS_COMPOSIO_KEY == 'true'
        env:
          HAS_COMPOSIO_KEY: ${{ secrets.COMPOSIO_API_KEY != '' }}
        run: npm install @composio/core

      - name: Check Composio connections
        id: composio
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          if [ -z "${COMPOSIO_API_KEY:-}" ]; then
            echo "::warning::COMPOSIO_API_KEY secret not set — skipping Composio connection check"
            echo '{"skipped": true, "reason": "COMPOSIO_API_KEY not set"}' > composio-status.json
            exit 0
          fi
          cat > health.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const items = accounts.items || [];
          const active = items.filter(a => a.status === 'ACTIVE');
          const inactive = items.filter(a => a.status !== 'ACTIVE');
          console.log(`Total: ${items.length}, Active: ${active.length}, Inactive: ${inactive.length}`);
          const fs = await import('fs');
          fs.writeFileSync('composio-status.json', JSON.stringify({
            total: items.length,
            active: active.length,
            inactive: inactive.length,
            accounts: items.map(a => ({ id: a.id, toolkit: a.toolkit?.slug, status: a.status }))
          }, null, 2));
          EOF
          node health.mjs

      - name: Comment summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Composio Status" >> "$GITHUB_STEP_SUMMARY"
          if [ -f composio-status.json ]; then
            cat composio-status.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "composio-status.json missing" >> "$GITHUB_STEP_SUMMARY"
          fi
