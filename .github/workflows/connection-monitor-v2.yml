name: Zion Connection Monitor v2.0

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: composio-connection-monitor
  cancel-in-progress: true

jobs:
  connection-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      ZION_USER_ID: ${{ secrets.ZION_USER_ID }}
      COMPOSIO_CALENDLY_CONNECTION_ID: ${{ secrets.COMPOSIO_CALENDLY_CONNECTION_ID }}
      COMPOSIO_WHATSAPP_CONNECTION_ID: ${{ secrets.COMPOSIO_WHATSAPP_CONNECTION_ID }}
      COMPOSIO_STRIPE_CONNECTION_ID: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
      COMPOSIO_RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
      COMPOSIO_BREVO_CONNECTION_ID: ${{ secrets.COMPOSIO_BREVO_CONNECTION_ID }}
      COMPOSIO_GMAIL_CONNECTION_ID: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
      COMPOSIO_HUBSPOT_CONNECTION_ID: ${{ secrets.COMPOSIO_HUBSPOT_CONNECTION_ID }}
      COMPOSIO_NOTION_CONNECTION_ID: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
      COMPOSIO_SLACK_CONNECTION_ID: ${{ secrets.COMPOSIO_SLACK_CONNECTION_ID }}
      COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      COMPOSIO_SENDGRID_CONNECTION_ID: ${{ secrets.COMPOSIO_SENDGRID_CONNECTION_ID }}
      COMPOSIO_ACTIVECAMPAIGN_CONNECTION_ID: ${{ secrets.COMPOSIO_ACTIVECAMPAIGN_CONNECTION_ID }}
      COMPOSIO_FIRECRAWL_CONNECTION_ID: ${{ secrets.COMPOSIO_FIRECRAWL_CONNECTION_ID }}
      COMPOSIO_SERPAPI_CONNECTION_ID: ${{ secrets.COMPOSIO_SERPAPI_CONNECTION_ID }}
      COMPOSIO_TAVILY_CONNECTION_ID: ${{ secrets.COMPOSIO_TAVILY_CONNECTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check Composio API key
        id: keycheck
        run: |
          if [ -z "$COMPOSIO_API_KEY" ]; then
            echo "::warning::COMPOSIO_API_KEY secret not set in this repo - skipping monitor. Add the secret (or an org-level secret) to enable."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.keycheck.outputs.has_key == 'true'
        with:
          node-version: 20
      - name: Install Composio SDK
        if: steps.keycheck.outputs.has_key == 'true'
        run: npm install @composio/core
      - name: Run Connection Monitor
        if: steps.keycheck.outputs.has_key == 'true'
        run: node .github/scripts/composio/connection-monitor-v2.mjs
      - name: Check for degraded connections
        if: steps.keycheck.outputs.has_key == 'true'
        id: health
        run: |
          if [ ! -f composio-connection-report.json ]; then
            echo "health_score=0" >> "$GITHUB_OUTPUT"
            echo "::warning::composio-connection-report.json missing"
            exit 0
          fi
          SCORE=$(python3 -c "import json; r=json.load(open('composio-connection-report.json')); print(int(r.get('healthScore', 0) or 0))")
          echo "health_score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "Health Score: $SCORE%"
      - name: Notify Slack on degradation
        if: ${{ steps.keycheck.outputs.has_key == 'true' && fromJSON(steps.health.outputs.health_score || '0') < 80 }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_WEBHOOK_URL secret not set; skipping Slack notification"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Warning: Zion Composio Health: ${{ steps.health.outputs.health_score }}% — connections degraded\"}" \
            "$SLACK_WEBHOOK_URL"
