name: Catalog health watchdog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "public/index.html"
      - ".github/workflows/catalog-health.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live homepage advertising + key routes
        run: |
          set -euo pipefail
          # Homepage hero/content rotates; fetch 3x and combine to avoid flakes.
          # NOTE (2026-10-03): re-aligned with live homepage (post-P0 EN shell).
          # Removed literal "Automation"/"Case Studies" (not present in current hero);
          # marketing action pending to restore that copy on the homepage.
          # NOTE (2026-10-02): expectations re-verified against the live homepage
          # after the 30/09 P0 restore (EN "recovered-2026-03-19" homepage).
          # Legacy PT strings and assets/js/zion-catalog.js + data/zion-catalog.json
          # were retired with the old homepage and removed from this watchdog.
          html="$(for i in 1 2 3; do curl -fsSL https://ziontechgroup.com/ || true; sleep 2; done)"
          must=(
            "Zion Tech Group"
            "AI Agents"
            "Discovery"
            'Discovery $99'
            "case-studies"
          )
          fail=0
          for s in "${must[@]}"; do
            if ! grep -Fq "$s" <<< "$html"; then
              echo "MISSING on homepage: $s"
              fail=1
            else
              echo "OK: $s"
            fi
          done
          routes=(
            https://ziontechgroup.com/
            https://ziontechgroup.com/services/
            https://ziontechgroup.com/managed-it-services/
            https://ziontechgroup.com/autonomous-ai-agents/
            https://ziontechgroup.com/ai-consulting-services/
            https://ziontechgroup.com/plans/
            https://ziontechgroup.com/discovery/
            https://ziontechgroup.com/ai-readiness-assessment/
            https://ziontechgroup.com/finops-consulting/
            https://ziontechgroup.com/zion-app-network/
            https://ziontechgroup.com/case-studies/
            https://ziontechgroup.com/blog/
            https://ziontechgroup.com/contact/
          )
          for u in "${routes[@]}"; do
            code=$(curl -sI -o /dev/null -w "%{http_code}" "$u")
            echo "$code $u"
            case "$code" in
              200|301|302) ;;
              *) echo "BAD STATUS $code $u"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "Watchdog found gaps."
            exit 1
            fi
            echo "Watchdog green."
