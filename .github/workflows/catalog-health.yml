name: Catalog health watchdog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "public/index.html"
      - "public/data/zion-catalog.json"
      - "public/assets/js/zion-catalog.js"
      - ".github/workflows/catalog-health.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live homepage advertising + catalog JS
        run: |
          set -euo pipefail
          # Homepage hero/content rotates; fetch 3x and combine to avoid flakes
          html="$(for i in 1 2 3; do curl -fsSL https://ziontechgroup.com/ || true; sleep 2; done)"
          must=(
            "Automação"
            "Agentes"
            "Managed IT"
            "Discovery"
            "FinOps"
            "Assessment"
            'Discovery $99'
          )
          fail=0
          for s in "${must[@]}"; do
            if ! printf '%s' "$html" | grep -Fq "$s"; then
              echo "MISSING on homepage: $s"
              fail=1
            else
              echo "OK: $s"
            fi
          done
          js="$(for i in 1 2 3; do curl -fsSL https://ziontechgroup.com/assets/js/zion-catalog.js || true; sleep 2; done)"
          js_must=(
            'Discovery $99'
            "Agentes Telegram"
            "Estimador FinOps"
            "ensureFinops"
            "finops-form"
          )
          for s in "${js_must[@]}"; do
            if ! printf '%s' "$js" | grep -Fq "$s"; then
              echo "MISSING in catalog JS: $s"
              fail=1
            else
              echo "OK JS: $s"
            fi
          done
          routes=(
            https://ziontechgroup.com/
            https://ziontechgroup.com/services/
            https://ziontechgroup.com/managed-it-services/
            https://ziontechgroup.com/autonomous-ai-agents/
            https://ziontechgroup.com/ai-consulting-services/
            https://ziontechgroup.com/plans/
            https://ziontechgroup.com/discovery/
            https://ziontechgroup.com/ai-readiness-assessment/
            https://ziontechgroup.com/finops-consulting/
            https://ziontechgroup.com/zion-app-network/
            https://ziontechgroup.com/case-studies/
            https://ziontechgroup.com/blog/
            https://ziontechgroup.com/contact/
            https://ziontechgroup.com/assets/js/zion-catalog.js
          )
          for u in "${routes[@]}"; do
            code=$(curl -sI -o /dev/null -w "%{http_code}" "$u")
            echo "$code $u"
            case "$code" in
              200|301|302) ;;
              *) echo "BAD STATUS $code $u"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "Watchdog found gaps."
            exit 1
          fi
          echo "Watchdog green."
